<title>Dashboard de Produção</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --critical: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --critical: #e66767;
  }
  * { box-sizing: border-box; }
  body { background: var(--page); margin: 0; }
  .gate-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 16px;
  }
  .gate-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
    width: 100%;
    max-width: 340px;
  }
  .gate-card h1 { font-size: 16px; margin: 0 0 4px; color: var(--text-primary); }
  .gate-card p { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 18px; }
  .gate-card input {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
    margin-bottom: 10px;
    text-align: center;
    letter-spacing: 0.04em;
  }
  .gate-card input:focus { outline: 2px solid var(--series-1); outline-offset: -1px; }
  .gate-card button {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    background: var(--series-1);
    color: #fff;
    cursor: pointer;
  }
  .gate-card button:disabled { opacity: 0.6; cursor: default; }
  .gate-error { color: var(--critical); font-size: 12.5px; margin-top: 10px; display: none; }
  .gate-error.show { display: block; }
</style>
<div class="gate-wrap">
  <div class="gate-card">
    <h1>Dashboard de Produção</h1>
    <p>Acesso restrito. Digite a senha que você recebeu para abrir este painel.</p>
    <input type="password" id="gatePass" placeholder="Senha de acesso" autocomplete="off" />
    <button id="gateBtn">Acessar</button>
    <div class="gate-error" id="gateError">Senha incorreta. Tente novamente.</div>
  </div>
</div>

const ITERATIONS = 250000;

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function tryUnlock(passcode) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passcode), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBytes(SALT_B64), iterations: ITERATIONS, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const plainBuf = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64ToBytes(IV_B64) },
    key,
    b64ToBytes(CIPHERTEXT_B64)
  );
  return new TextDecoder().decode(plainBuf);
}

const btn = document.getElementById('gateBtn');
const input = document.getElementById('gatePass');
const errorEl = document.getElementById('gateError');

async function attempt() {
  const pass = input.value.trim();
  if (!pass) return;
  btn.disabled = true;
  btn.textContent = 'Verificando...';
  errorEl.classList.remove('show');
  try {
    const html = await tryUnlock(pass);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    errorEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Acessar';
  }
}

btn.addEventListener('click', attempt);
input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
input.focus();
</script>
